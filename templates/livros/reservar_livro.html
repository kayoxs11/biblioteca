<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reservar Livro</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}"/>
  <link rel="stylesheet" href="{% static 'css/acervo.css' %}"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-logo">
      <div class="logo-icon">📚</div>
      <span class="logo-text">Biblioteca</span>
    </div>
    <a href="{% url 'acervo' %}" class="nav-btn">← Voltar ao Acervo</a>
  </nav>

  <main class="main-content">
    <div class="page-header">
      <div>
        <p class="page-label">RESERVA</p>
        <h1 class="page-title">Reservar livro</h1>
        <p class="page-sub">Confirme a reserva do livro abaixo.</p>
      </div>
    </div>

    <div class="form-card" style="max-width: 620px; margin: 0 auto;">
      <h2 style="margin-bottom: 1rem; color: #1f2937;">{{ livro.titulo }}</h2>
      <p><strong>Autor:</strong> {{ livro.autor }}</p>
      <p><strong>ISBN:</strong> {{ livro.isbn|default:"—" }}</p>
      <p><strong>Quantidade disponível:</strong> {{ livro.quantidade }}</p>

      <form method="POST" style="margin-top: 2rem;">
        {% csrf_token %}
        <div class="form-actions">
          <a href="{% url 'acervo' %}" class="btn-outline">Cancelar</a>
          <button type="submit" class="btn-gold">✅ Confirmar Reserva</button>
        </div>
      </form>
    </div>
  </main>

</body>
</html>
