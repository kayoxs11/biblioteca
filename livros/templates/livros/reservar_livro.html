<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reservar Livro</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}"/>
  <link rel="stylesheet" href="{% static 'css/acervo.css' %}"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-logo">
      <div class="logo-icon">📚</div>
      <span class="logo-text">Biblioteca</span>
    </div>
    <a href="{% url 'acervo' %}" class="nav-btn">← Voltar ao Acervo</a>
  </nav>

  <main class="main-content">
    <div class="page-header">
      <div>
        <p class="page-label">RESERVA</p>
        <h1 class="page-title">{{ livro.titulo }}</h1>
        <p class="page-sub">Confirme a reserva deste livro</p>
      </div>
    </div>

    <div class="form-card" style="max-width: 600px; margin: 0 auto; text-align: center;">
      <p style="font-size: 1.1rem; margin: 2rem 0;">
        <strong>Autor:</strong> {{ livro.autor }}<br>
        <strong>Quantidade disponível:</strong> {{ livro.quantidade }}
      </p>

      <form method="POST">
        {% csrf_token %}
        <div class="form-actions">
          <a href="{% url 'acervo' %}" class="btn-outline">Cancelar</a>
          <button type="submit" class="btn-gold">✅ Confirmar Reserva</button>
        </div>
      </form>
    </div>
  </main>

</body>
</html>
